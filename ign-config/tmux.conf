# IGOS Nusantara's tmux defaults (ign-config). ~/.tmux.conf, read after this,
# can change any of them.

# General
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
# The mouse scrolls and resizes panes.
set -g mouse on
set -g history-limit 50000
# Windows and panes count from 1, and close up the gaps.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# No delay after Esc, for vim.
set -s escape-time 0

# Keys: the prefix is C-a; C-a a sends C-a to the program (Home in bash).
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix
bind a send-prefix

# v splits side by side, h one above the other, in the pane's folder.
unbind '"'
unbind %
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"

# Alt with h/j/k/l or the arrows moves between panes, without the prefix.
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# C-a r reloads these and the user's own.
bind r source-file /etc/tmux.conf \; if-shell "test -f ~/.tmux.conf" "source-file ~/.tmux.conf" \; if-shell "test -f ~/.config/tmux/tmux.conf" "source-file ~/.config/tmux/tmux.conf" \; display-message "Config reloaded!"

# Status bar: the session on the left, the date and time on the right.
set -g status-interval 3
set -g status-style 'bg=#333333 fg=#ffffff'
set -g status-left-length 20
set -g status-left "#[fg=yellow,bold][#[fg=blue]#S#[fg=yellow,bold]] "
set -g status-left-style ""
set -g status-right "%Y-%m-%d %H:%M:%S "
setw -g window-status-current-style 'fg=white bg=blue,bold'
setw -g window-status-current-format ' #I:#W '
set -g pane-active-border-style fg=white,bg=green,bold
set -g pane-border-style fg=colour238

# Copy mode (C-a [) moves as vi does.
setw -g mode-keys vi
